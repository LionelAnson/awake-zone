[package]
name = "personal-day"
version = "0.5.0"
description = "Awake Zone — a clock scaled to your planned waking day"
authors = ["Personal Day"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "personal_day_lib"
crate-type = ["rlib"]

[build-dependencies]
cc = "=1.5.1"
tauri-build = { version = "2", features = [] }

[features]
default = ["live-capture"]
live-capture = []
window-diagnostics = []
experimental-backdrop = []
backdrop-diagnostics = ["window-diagnostics", "experimental-backdrop"]

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"

[target.'cfg(windows)'.dependencies]
base64 = "0.22"
windows = { version = "0.62", features = ["Win32_UI_Shell", "Win32_System_Com", "Win32_System_WinRT", "Win32_System_WinRT_Composition", "System", "UI_Composition", "UI_Composition_Desktop"] }
windows-numerics = "0.3"
winreg = "0.10"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
