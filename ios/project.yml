name: PersonalDay
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  SWIFT_VERSION: "5.0"
  DEVELOPMENT_TEAM: ""
targets:
  PersonalDay:
    type: application
    platform: iOS
    sources:
      - path: PersonalDay/App
      - path: PersonalDay/Shared
      - path: PersonalDay/Assets.xcassets
    entitlements:
      path: PersonalDay/App/PersonalDay.entitlements
    info:
      path: PersonalDay/App/Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.personalday.widget
      INFOPLIST_KEY_CFBundleDisplayName: 醒时区
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: PersonalDayWidget
        embed: true
  PersonalDayWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: PersonalDay/Widget
      - path: PersonalDay/Shared
    entitlements:
      path: PersonalDay/Widget/PersonalDayWidget.entitlements
    info:
      path: PersonalDay/Widget/Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.personalday.widget.widget
      INFOPLIST_KEY_CFBundleDisplayName: 醒时区
  PersonalDayTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: PersonalDay
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.personalday.widget.tests
