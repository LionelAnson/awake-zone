<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">醒时区透明同心双环图标预览</title>
  <desc id="desc">透明背景图标在浅色、深色和棋盘格背景中的预览。</desc>
  <defs>
    <pattern id="checker" width="28" height="28" patternUnits="userSpaceOnUse">
      <rect width="28" height="28" fill="#f5f7fa"/>
      <path d="M0 0h14v14H0zM14 14h14v14H14z" fill="#dfe5eb"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0d1b2e" flood-opacity=".24"/>
    </filter>
    <g id="icon" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="256" cy="256" r="205" stroke="#75879a" stroke-width="28" opacity=".34"/>
      <path d="M256 51a205 205 0 0 1 177.535 307.5" stroke="#63758b" stroke-width="28" opacity=".82"/>
      <path d="M433.535 358.5A205 205 0 1 1 256 51" stroke="#ffc857" stroke-width="28"/>
      <circle cx="78.465" cy="358.5" r="15" fill="#ffc857" stroke="none"/>
      <circle cx="256" cy="51" r="15" fill="#63758b" stroke="none"/>
      <circle cx="256" cy="256" r="127" stroke="#dce7ef" stroke-width="16" opacity=".94"/>
      <path d="M256 129v18M383 256h-18M256 383v-18M129 256h18" stroke="#dce7ef" stroke-width="10" opacity=".92"/>
      <path d="M256 256V190M256 256l54 31" stroke="#dce7ef" stroke-width="15"/>
      <circle cx="256" cy="256" r="14" fill="#ffc857" stroke="none"/>
    </g>
  </defs>
  <rect width="1400" height="900" fill="#eef2f6"/>
  <text x="70" y="72" fill="#172235" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="32" font-weight="700">醒时区 · 同心双环透明图标</text>
  <text x="70" y="108" fill="#60758b" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17">外环：醒时区时钟　·　内环：现实时钟　·　清醒 16 小时 / 睡眠 8 小时</text>

  <g filter="url(#shadow)">
    <rect x="70" y="150" width="400" height="610" rx="28" fill="url(#checker)"/>
    <rect x="500" y="150" width="400" height="610" rx="28" fill="#f8fafc"/>
    <rect x="930" y="150" width="400" height="610" rx="28" fill="#172235"/>
  </g>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <text x="105" y="205" fill="#172235" font-size="22" font-weight="700">透明背景</text>
    <text x="105" y="238" fill="#60758b" font-size="15">棋盘格显示透明区域</text>
    <g transform="translate(115 285) scale(.66)"><use href="#icon"/></g>
    <text x="105" y="690" fill="#60758b" font-size="15">图标本体没有背景色</text>
    <text x="535" y="205" fill="#172235" font-size="22" font-weight="700">浅色桌面</text>
    <text x="535" y="238" fill="#60758b" font-size="15">内环时钟保持清晰</text>
    <g transform="translate(545 285) scale(.66)"><use href="#icon"/></g>
    <text x="535" y="690" fill="#60758b" font-size="15">透明边缘不形成方形底板</text>
    <text x="965" y="205" fill="#fff" font-size="22" font-weight="700">深色桌面</text>
    <text x="965" y="238" fill="#b5c4d2" font-size="15">暖色清醒段仍然突出</text>
    <g transform="translate(975 285) scale(.66)"><use href="#icon"/></g>
    <text x="965" y="690" fill="#b5c4d2" font-size="15">后续可提供单色托盘版本</text>

    <text x="70" y="825" fill="#60758b" font-size="14">比例：睡眠段 120° = 8/24；清醒段 240° = 16/24。</text>
    <text x="1070" y="825" fill="#60758b" font-size="14">外环默认表示醒时区，内环表示现实时钟。</text>
  </g>
</svg>
